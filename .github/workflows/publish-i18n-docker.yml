name: Publish i18n Docker Image

on:
  push:
    branches: [dev-i18n]
    tags: ["v*.*.*.*"]
    paths:
      - ".github/workflows/publish-i18n-docker.yml"
      - ".dockerignore"
      - "core/**"
      - "framework/**"
      - "plugins/**"
      - "transports/**"
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-i18n-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    if: github.ref == 'refs/heads/dev-i18n' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set image name
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            base_version=$(cat transports/version)
            if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
              [ "${version%.*}" != "$base_version" ] ||
              [ "$version" != "$(cat transports/version.i18n)" ]; then
              echo "Release tag must match transports/version.i18n and extend transports/version by one revision" >&2
              exit 1
            fi
            image_tag="$image:v$version-$ARCH"
          else
            version="dev-i18n-$GITHUB_SHA"
            image_tag="$image:sha-$GITHUB_SHA-$ARCH"
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GHCR
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image from local module sources
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: transports/Dockerfile.local
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Bifrost multilingual Dashboard
            org.opencontainers.image.version=v${{ env.VERSION }}
          cache-from: type=gha,scope=i18n-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=i18n-${{ matrix.arch }}

      - name: Test container health and bundled Chinese UI
        run: |
          set -euo pipefail
          cleanup() {
            docker logs bifrost-i18n-smoke || true
            docker rm -f -v bifrost-i18n-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name bifrost-i18n-smoke \
            -p 127.0.0.1:8080:8080 "$IMAGE_TAG"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8080/api/version -o /tmp/bifrost-version.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          actual = json.loads(Path("/tmp/bifrost-version.json").read_text())
          expected = "v" + os.environ["VERSION"]
          if actual != expected:
              raise SystemExit(f"Version mismatch: {actual!r} != {expected!r}")
          PY
          curl --fail --silent --show-error http://127.0.0.1:8080/login -o /tmp/bifrost-login.html
          # Vite may keep translations in the entrypoint or a preloaded chunk.
          python3 - <<'PY'
          import re
          import urllib.request
          from pathlib import Path
          html = Path("/tmp/bifrost-login.html").read_text()
          assets = re.findall(r'(?:src|href)="(/assets/[^"?]+\.js)"', html)
          if not assets:
              raise SystemExit("Dashboard JavaScript assets not found")
          for asset in dict.fromkeys(assets):
              with urllib.request.urlopen("http://127.0.0.1:8080" + asset, timeout=10) as response:
                  script = response.read()
              if b"bifrost.locale" in script and b"zh-CN" in script:
                  print("Verified Chinese UI resource:", asset)
                  break
          else:
              raise SystemExit("Chinese UI resource not found in served JavaScript assets")
          PY

      - name: Push tested architecture image
        run: docker push "$IMAGE_TAG"

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GHCR
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify multi-platform tags
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            architecture_tag="$tag"
            extra_tag=latest
          else
            tag=dev-i18n
            architecture_tag="sha-$GITHUB_SHA"
            extra_tag="sha-$GITHUB_SHA"
          fi
          docker buildx imagetools create \
            --tag "$image:$tag" \
            --tag "$image:$extra_tag" \
            "$image:$architecture_tag-amd64" \
            "$image:$architecture_tag-arm64"
          docker buildx imagetools inspect "$image:$tag" --raw > /tmp/bifrost-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/bifrost-manifest.json").read_text())
          platforms = {(item["platform"]["os"], item["platform"]["architecture"]) for item in manifest["manifests"]}
          expected = {("linux", "amd64"), ("linux", "arm64")}
          if not expected.issubset(platforms):
              raise SystemExit(f"Missing platforms: {expected - platforms}")
          PY
          echo "PUBLISHED_IMAGE=$image:$tag" >> "$GITHUB_ENV"
          {
            echo "Published \`$image:$tag\` for linux/amd64 and linux/arm64."
            echo
            echo '```sh'
            echo "docker pull $image:$tag"
            echo "docker run -d --name bifrost-zh -p 127.0.0.1:8080:8080 -v bifrost-zh-data:/app/data $image:$tag"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish formal GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/i18n-release-notes.md"
          cat > "$notes" <<EOF
          Bifrost 中文发行版，基于上游 dev 分支的 ${version%.*} 版本，中文修订号为 ${version##*.}。

          - Dashboard 支持简体中文及其他 10 种界面语言。
          - 支持 linux/amd64 和 linux/arm64。
          - 两种架构均通过容器健康、程序版本及中文 UI 资源检查。
          - 镜像已公开，可直接拉取。

          \`\`\`sh
          docker pull $PUBLISHED_IMAGE
          \`\`\`

          Latest: \`${PUBLISHED_IMAGE%:*}:latest\`
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Bifrost 中文版 $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --latest
